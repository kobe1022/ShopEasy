# Aufruf:   uv sync --all-groups
#           uv run python -m shopeasy.marketplace_mock   # REST Mock-Marktplatz (Port 8001)
#           uv run python -m shopeasy.return_service     # REST Retouren-Service (Port 8002)
#           uv run python -m shopeasy.warehouse_grpc     # gRPC Wareneingang (Port 50051)
#           uv run python -m shopeasy.consumers.kundeninfo
#           uv run python -m shopeasy.consumers.eventlog
#           uv run pytest
#           uv run ruff check src tests
#           uv run ruff format src tests

[project]
name = "shopeasy"
version = "0.1.0"
description = "Retourenabwicklung ShopEasy: REST, gRPC und Messaging (Sprint 2)"
readme = "README.md"
authors = [
    { name = "Benjamin Köken" },
    { name = "Nikky" },
    { name = "Muhammed" },
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.0",
    "grpcio>=1.85.1",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pika>=1.4.4",
    "protobuf>=7.36.2",
    "pydantic>=2.14.2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.20,<1.0.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "grpcio-tools>=1.85.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
extend-exclude = ["src/shopeasy/warehouse/v1"]
